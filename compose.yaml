name: iot_project

services:
  app:
    image: iot-project:local
    build: .
    container_name: iot_project_app
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:${IOT_APP_PORT:-8088}:80"
    depends_on:
      mosquitto:
        condition: service_healthy
    env_file:
      - path: Backend/.env
        format: raw
      - path: Backend/.env.bth4
        format: raw
    environment:
      IOT_DB_URL: "jdbc:mysql://${IOT_DOCKER_DB_HOST:-host.docker.internal}:${IOT_DOCKER_DB_PORT:-3307}/${MYSQL_DATABASE:?Configure MYSQL_DATABASE in Backend/.env}?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true"
      IOT_MQTT_URI: "tcp://mosquitto:1883"
      IOT_MQTT_CLIENT_ID: iot-backend-bth4
      IOT_FRONTEND_ORIGIN: "${IOT_DOCKER_FRONTEND_ORIGIN:-http://localhost:8088}"
      SERVER_PORT: "8080"
      IOT_LED_DEMO_ENABLED: "false"

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: iot_project_mosquitto
    restart: unless-stopped
    entrypoint: ["sh", "/mosquitto/start.sh"]
    ports:
      - "0.0.0.0:1325:1883"
    env_file:
      - path: Backend/.env.bth4
        format: raw
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - type: bind
        source: ./docker/mosquitto/.passwords
        target: /run/secrets/mosquitto-passwords
        read_only: true
        bind:
          create_host_path: false
      - ./docker/mosquitto/healthcheck.sh:/mosquitto/healthcheck.sh:ro
      - ./docker/mosquitto/start.sh:/mosquitto/start.sh:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "sh", "/mosquitto/healthcheck.sh"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 15s

volumes:
  mosquitto_data:
