spring.application.name=iot-backend
server.port=8080

spring.datasource.url=${IOT_DB_URL}
spring.datasource.username=${IOT_DB_USER}
spring.datasource.password=${IOT_DB_PASSWORD}
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
iot.jwt.ttl-seconds=${IOT_JWT_TTL_SECONDS:3600}
iot.mqtt.uri=${IOT_MQTT_URI}
iot.mqtt.client-id=${IOT_MQTT_CLIENT_ID:iot-backend-telemetry}
iot.mqtt.username=${IOT_MQTT_USER:}
iot.mqtt.password=${IOT_MQTT_PASSWORD:}
iot.ws.allowed-origin=${IOT_FRONTEND_ORIGIN:http://localhost:5173}
